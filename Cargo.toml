[package]
name = "sound-keyboard"
version = "0.1.0"
authors = ["FPG Schiba <CraftZockerLP@gmail.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "sound-keyboard"
harness = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# HAL + panic handler
esp-hal              = { version = "=1.0.0-rc.0", features = ["esp32s3", "unstable"] }
esp-backtrace        = { version = "0.18",  features = ["esp32s3", "panic-handler", "println"] }
esp-println          = { version = "0.16",  features = ["esp32s3", "log-04"] }
log                  = { version = "0.4",   default-features = false }

# Embassy async runtime
embassy-executor     = { version = "0.7",  features = ["task-arena-size-20480"] }
embassy-time         = { version = "0.4" }
embassy-sync         = { version = "0.6" }
embassy-futures      = { version = "0.1" }
esp-hal-embassy      = { version = "=0.9.1",  features = ["esp32s3"] }

# USB HID
usb-device                     = { version = "0.3" }
usbd-human-interface-device    = { version = "0.6" }

critical-section = "1.2"

# Patch radium 0.7.0 to correctly detect Xtensa (ESP32) as a 32-bit-only atomic target.
# Without this, radium unconditionally enables AtomicI64/AtomicU64 which don't exist on ESP32-S3.
[patch.crates-io]
radium = { path = "patches/radium-0.7.0" }
